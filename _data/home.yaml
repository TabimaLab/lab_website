hero:
  headline: How can understudided fungi teach us about life
  lede: The Tabima Lab at Clark University studies the genomics, ecology and evolution of microscopic fungi associated to animal and plant hosts. From *Basidiobolus*, a fungus that lives in frog guts, leaf litter, soil and pond sediment, to plant pathogens, microbiomes and host-fungi interactions, our goal is to explore how these organisms can teach us the novelties of life.
  image: /images/IMG_1300.jpeg
  video: /images/hero.mp4
  image_alt: Basidiobolus ranarum growing for 48h in PDA media
  caption: Basidiobolus ranarum growing for 48h in PDA media (Credit Steven King, Clark University)
  primary_button:
    text: See our research
    link: /research/
  secondary_button:
    text: Join the lab
    link: /join/
intro:
  text: |-
    Fungi are widely known as molds and mushrooms, but most of the fungal world
    is microscopic, and the majority of it has never been described. Our group studies
    the diversity, genomics, evolution and ecology of these small fungi and the
    hosts and ecosystems they live in.

    We use the genus *Basidiobolus* as our model. It lets us ask how fungi and
    hosts evolve together, what secondary metabolism does for a fungus, how
    fungal populations change over time, and how fungi and bacteria share the
    gut.
