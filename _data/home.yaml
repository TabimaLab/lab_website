    The Tabima Lab at Clark University sequences, compares and names them.
    We start with *Basidiobolus*, a fungus that lives in frog guts, leaf litter,
    soil and pond sediment.
  # The round picture in the hero. Drop a new photo in /images and change the name.
  image: images/IMG_1300.jpeg
