---
layout: default
---
<header class="page-head" data-hyphae="edge">
  <div class="hyphae" aria-hidden="true"></div>
  <div class="wrap page-head__inner">
    <h1 class="page-head__title" data-hyphae-avoid>{{ page.title }}</h1>
    {%- if page.lede %}
    <p class="page-head__lede" data-hyphae-avoid>{{ page.lede }}</p>
    {%- endif %}
  </div>
</header>

<div class="wrap page-body">
  {{ content }}
</div>
