name: debug-build
on:
  push:
    branches: [debug-build]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v4
      - name: Build like main does, surface the error
        run: |
          printf "\n\nurl: ${{ steps.pages.outputs.origin }}" >> _config.yaml
          set +e
          JEKYLL_ENV=production bundle exec jekyll build --trace --baseurl "${{ steps.pages.outputs.base_path || '' }}" > build.log 2>&1
          code=$?
          echo "exit=$code origin=${{ steps.pages.outputs.origin }} base=${{ steps.pages.outputs.base_path }}"
          if [ $code -ne 0 ]; then
            echo "::error title=jekyll::$(grep -v '^\s*$' build.log | tail -n 25 | cut -c1-300 | sed 's/%/%25/g' | tr '\n' '|' )"
            exit 1
          fi
