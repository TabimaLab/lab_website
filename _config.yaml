### Site settings
# Most day-to-day edits do NOT happen here. See EDITING.md for where things live.

title: Tabima Laboratory @ Clark University
short_title: Tabima Lab
description: Evolutionary mycology, population genetics and ecology of understudied microfungi
baseurl: ""
timezone: America/New_York

# Link previews (Slack, X, iMessage...) use this image
share_image: images/share.jpg

# Shown in the footer and on the contact page
contact:
  email: contact@TabimaLab.com
  institution: Department of Biology, Clark University
  building: Lasry Center for Bioscience
  street: 15 Maywood Street
  city: Worcester, MA 01610
  directions: Second floor of the Lasry Center for Bioscience

# Footer icons. Delete a line to remove a link.
links:
  email: contact@TabimaLab.com
  google-scholar: t1P5G4QAAAAJ
  orcid: 0000-0002-3603-2691
  github: TabimaLab
  twitter: TabimaLab

# Where the "edit this site" link in the footer points
repo: https://github.com/TabimaLab/lab_website


### Jekyll settings (leave these alone unless you know why)

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: "members"
    values:
      layout: member
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  members:
    output: true
  posts:
    output: true

plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

exclude:
  - README.md
  - EDITING.md
  - LICENSE.md
  - CITATION.cff
  - Gemfile
  - Gemfile.lock
  - lab_website.Rproj
  - cite.sh
  - start.sh
  - "start 2.sh"
  - _cite
  - .docker
